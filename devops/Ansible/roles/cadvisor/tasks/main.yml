---
- name: Run cAdvisor container
  community.docker.docker_container:
    name: cadvisor
    image: google/cadvisor:v0.47.3
    state: started
    restart_policy: always
    privileged: true
    published_ports:
      - "8081:8080"
    ipc_mode: host
    pid_mode: host
    user: "0:0"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    env:
      CADVISOR_HEALTHCHECK_URL: "http://localhost:8080/healthz"
