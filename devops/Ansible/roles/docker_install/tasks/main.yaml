---
- name: Install python3-pip and python3-docker for Ansible modules
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-docker
    state: present
    update_cache: yes

- name: Download official Docker installation script
  ansible.builtin.get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: '0755'

- name: Run Docker installation script
  ansible.builtin.shell: /tmp/get-docker.sh
  args:
    creates: /usr/bin/docker

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Create internal Docker network for app
  community.docker.docker_network:
    name: teachua_network

