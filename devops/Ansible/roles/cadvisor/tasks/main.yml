---
- name: Stop and remove old cAdvisor container
  community.docker.docker_container:
    name: cadvisor
    state: absent

- name: Set architecture variable to amd64
  set_fact:
    cadvisor_arch: "amd64"
  when: ansible_architecture == "x86_64"

- name: Set architecture variable to arm64
  set_fact:
    cadvisor_arch: "arm64"
  when: ansible_architecture == "aarch64" or ansible_architecture == "arm64"

- name: Download correct cAdvisor binary
  get_url:
    url: "https://github.com/google/cadvisor/releases/download/v0.47.0/cadvisor"
    dest: /usr/local/bin/cadvisor
    mode: '0755'
    force: yes

- name: Create systemd service for cAdvisor
  copy:
    dest: /etc/systemd/system/cadvisor.service
    content: |
      [Unit]
      Description=cAdvisor Exporter
      After=network.target docker.service containerd.service
      Requires=docker.service

      [Service]
      Type=simple
      User=root
      Group=root
      ExecStart=/usr/local/bin/cadvisor \
        --port=8081 \
        --docker_only=true \
        --docker=unix:///var/run/docker.sock \
        --containerd=/run/containerd/containerd.sock
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd, enable and start cAdvisor service
  systemd:
    name: cadvisor
    state: restarted
    daemon_reload: yes
    enabled: yes

